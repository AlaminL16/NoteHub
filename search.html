<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Search notes | NoteHub</title>
    <meta
      name="description"
      content="Search thousands of study notes on NoteHub and filter by subject, level and file type."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="global.css" />
    <link rel="stylesheet" href="search.css" />
    <link rel="stylesheet" href="responsive.css" />
  </head>
  <body data-page="search">
    <div id="site-nav"></div>

    <div class="search-top">
      <div class="container">
        <form class="search-bar" id="searchForm" role="search">
          <label class="sr-only" for="query">Search notes</label>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="7" />
            <path d="M20 20l-3.5-3.5" />
          </svg>
          <input id="query" name="q" type="search" placeholder="Search notes, subjects, skills..." />
        </form>
      </div>
    </div>

    <main class="container page-body">
      <div class="search-layout">
        <!-- Filters -->
        <aside class="filters">
          <div class="filters-head">
            <h2 style="font-size: 16px; margin: 0">Filters</h2>
            <button class="btn-text btn" type="button" id="clearFilters">Clear all</button>
          </div>

          <div class="filter-group">
            <h3>Subject</h3>
            <label class="check"><input type="checkbox" data-filter="subject" value="Python" /> <span>Python</span></label>
            <label class="check"><input type="checkbox" data-filter="subject" value="Programming" /> <span>Programming</span></label>
            <label class="check"><input type="checkbox" data-filter="subject" value="Computer Science" /> <span>Computer Science</span></label>
            <label class="check"><input type="checkbox" data-filter="subject" value="Others" /> <span>Others</span></label>
          </div>

          <div class="filter-group">
            <h3>Level</h3>
            <label class="check"><input type="checkbox" data-filter="level" value="Beginner" /> <span>Beginner</span></label>
            <label class="check"><input type="checkbox" data-filter="level" value="Intermediate" /> <span>Intermediate</span></label>
            <label class="check"><input type="checkbox" data-filter="level" value="Advanced" /> <span>Advanced</span></label>
          </div>

          <div class="filter-group">
            <h3>File type</h3>
            <label class="check"><input type="checkbox" data-filter="file" value="PDF" /> <span>PDF</span></label>
            <label class="check"><input type="checkbox" data-filter="file" value="DOCX" /> <span>DOCX</span></label>
            <label class="check"><input type="checkbox" data-filter="file" value="PPT" /> <span>PPT</span></label>
          </div>
        </aside>

        <!-- Results -->
        <section>
          <div class="results-head">
            <h1 id="resultsTitle">All notes</h1>
            <div class="sort-wrap">
              <label for="sort">Sort by</label>
              <select id="sort">
                <option value="relevant">Most Relevant</option>
                <option value="newest">Newest</option>
                <option value="downloads">Most Downloaded</option>
                <option value="rating">Highest Rated</option>
              </select>
            </div>
          </div>

          <div class="result-list" id="resultList"></div>
        </section>
      </div>
    </main>

    <div id="site-footer"></div>
    <div id="site-bottom-nav"></div>

    <script src="global.js"></script>
    <script src="search.js"></script>
  </body>
</html>
